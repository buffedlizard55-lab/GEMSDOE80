[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gems80"
version = "80.1.0"
description = "GEMSDOE80 — Lane H80-DPVC: Updip 60-Deg Basement-to-Surface Coupler, Hydrothermal Vent Conduit & Self-Masked Submodular Fault Detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "rasterio>=1.3",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "lightgbm>=4.0",
    "pyproj>=3.5",
]

[tool.pytest.ini_options]
pythonpath = ["src", "vendor"]
testpaths = ["tests"]

[project.urls]
Homepage = "https://buffedlizard55-lab.github.io/GEMSDOE80/"
Repository = "https://github.com/buffedlizard55-lab/GEMSDOE80"
